name: Build iPadn

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release after the build passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 40
    defaults:
      run:
        working-directory: src
        shell: bash
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Go for the Mac PKG bridge
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
          cache: false

      - name: Set up Rust for the native installation library
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
          cargo --version

      - name: Select Xcode and report SDK
        run: |
          if [ -d /Applications/Xcode_26.0.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.0.1.app/Contents/Developer
          elif [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -showsdks
          mkdir -p build

      - name: Verify project and repository-local runtime
        run: |
          python3 scripts/assemble_runtime.py
          python3 scripts/verify_project.py

      - name: Build unsigned device IPA
        env:
          IPADN_REQUIRE_MACPKG: '1'
          IPADN_REQUIRE_NATIVE: '1'
        run: |
          set -o pipefail
          bash scripts/build_unsigned_ipa.sh 2>&1 | tee build/build.log
          IPADN_REQUIRE_MACPKG=1 IPADN_REQUIRE_NATIVE=1 python3 scripts/verify_ipa.py build/iPadn-unsigned.ipa
          shasum -a 256 build/iPadn-unsigned.ipa > build/iPadn-unsigned.ipa.sha256
          python3 - <<'PY'
          import json, os, subprocess, plistlib, zipfile
          from pathlib import Path
          with zipfile.ZipFile('build/iPadn-unsigned.ipa') as ipa:
              info = plistlib.loads(ipa.read('Payload/iPadn.app/Info.plist'))
          Path('build/build-info.json').write_text(json.dumps({
              'version': info['CFBundleShortVersionString'],
              'build': info['CFBundleVersion'],
              'commit': os.environ['GITHUB_SHA'],
              'run': os.environ['GITHUB_RUN_ID'],
              'xcode': subprocess.check_output(['xcodebuild', '-version'], text=True).strip(),
              'minimum_ios': info['MinimumOSVersion'],
              'signed': False,
              'note': 'Sign with your own tool before installing.'
          }, indent=2) + '\n')
          PY

      - name: Upload IPA
        id: ipa
        uses: actions/upload-artifact@v4
        with:
          name: iPadn-unsigned-ipa
          path: |
            src/build/iPadn-unsigned.ipa
            src/build/iPadn-unsigned.ipa.sha256
            src/build/build-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPadn-build-diagnostics
          path: |
            src/build/*.log
            src/build/ipa-verification.json
          if-no-files-found: warn
          retention-days: 14

      - name: Write download summary
        if: always() && steps.ipa.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.ipa.outputs.artifact-url }}
        run: |
          {
            echo '## iPadn'
            echo
            echo "[Download the unsigned IPA]($ARTIFACT_URL)"
            echo
            echo 'Sign it with your own tool after downloading. No Apple account, certificate or private key is uploaded to GitHub.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    needs: build
    if: (github.event_name == 'workflow_dispatch' && inputs.publish_release) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iPadn-unsigned-ipa
          path: release
      - name: Verify and prepare release assets
        id: release
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path('release')
          info = json.loads((root / 'build-info.json').read_text())
          verification = json.loads((root / 'ipa-verification.json').read_text())
          assert info['commit'] == os.environ['EXPECTED_COMMIT'], 'Source commit mismatch'
          assert not info['signed'] and verification['passed'], 'Invalid unsigned IPA'
          version = info['version']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'Invalid release version'
          if os.environ['RELEASE_REF'].startswith('refs/tags/'):
              assert os.environ['RELEASE_REF'] == 'refs/tags/v' + version, 'Release tag/version mismatch'
          assert verification['version'] == version and verification['build'] == info['build']
          ipa = root / 'iPadn-unsigned.ipa'
          digest = hashlib.sha256(ipa.read_bytes()).hexdigest()
          assert digest == (root / 'iPadn-unsigned.ipa.sha256').read_text().split()[0], 'IPA checksum mismatch'
          asset = ipa.with_name('iPadn-' + version + '-unsigned.ipa')
          ipa.rename(asset)
          (root / (asset.name + '.sha256')).write_text(digest + '  ' + asset.name + '\n')
          notes = '\n'.join([
              '## iPadn ' + version,
              '',
              'Unsigned IPA. Sign it with your own signing tool, then install.',
              'New in this build: a one-tap on-device Decryptor (bottom tab) that strips FairPlay (cryptid=1) from apps you own - no PC, no Mac, no manual steps.',
              '',
              'SHA-256: `' + digest + '`',
          ])
          (root / 'notes.md').write_text(notes + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('tag=v' + version + '\n')
              output.write('asset=' + str(asset) + '\n')
          PY
      - name: Publish unsigned IPA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_ASSET: ${{ steps.release.outputs.asset }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" "$RELEASE_ASSET.sha256" release/build-info.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "iPadn $RELEASE_TAG" \
            --notes-file release/notes.md --latest
      - name: Update the AltStore source
        # Signing tools read altstore-source.json from main to offer the update.
        # A failure here must not undo a published release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git fetch --depth 1 origin main
          git checkout -B main origin/main
          python3 src/scripts/generate_altstore_source.py
          if git diff --quiet -- altstore-source.json; then
            echo "altstore-source.json is already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add altstore-source.json
            git commit -m "Update AltStore source for $RELEASE_TAG [skip ci]"
            git push origin main
          fi
