name: Verify native install probe

on:
  push:
    paths:
      - 'src/tools/native_install/**'
      - '.github/workflows/native-install-probe.yml'
  pull_request:
    paths:
      - 'src/tools/native_install/**'
      - '.github/workflows/native-install-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-verification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: src/tools/native_install/requirements.txt
      - name: Install isolated probe dependency
        run: python -m pip install -r src/tools/native_install/requirements.txt
      - name: Compile and exercise the offline protocol harness
        run: |
          python -m compileall -q src/tools/native_install
          python -m unittest discover -s src/tools/native_install -p "test_*.py" -v
          python src/tools/native_install/native_install_probe.py check-backend
