name: fp-credential
on:
  workflow_dispatch:
    inputs:
      apple_email:
        description: "Apple ID email"
        required: true
        type: string
      app_password:
        description: "App-specific password (16 chars; Settings > Passwords & Security > App-Specific Passwords). REVOKED-OK: delete the run afterwards."
        required: true
        type: string
      ipa_url:
        description: "Optional: public link to an encrypted IPA (Google Drive file link OK) to decrypt in the same run"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  credential:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Install mas
        run: |
          set -e
          if ! command -v mas >/dev/null 2>&1; then
            brew install --quiet mas || { sleep 20; brew install mas; }
          fi
          mas --version

      - name: Sign in to Mac App Store
        env:
          EMAIL: ${{ inputs.apple_email }}
          PW: ${{ inputs.app_password }}
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "mas signin attempt $attempt"
            if mas signin "$EMAIL" "$PW" 2>&1; then break; fi
            if [ "$attempt" = "3" ]; then
              echo "signin failed after 3 attempts" >&2
              exit 1
            fi
            sleep 20
          done
          mas account

      - name: Ensure FairPlay credential exists
        run: |
          set -e
          CRED="$HOME/Library/FairPlay/credential.bin"
          for i in 1 2 3 4 5; do
            if [ -f "$CRED" ]; then break; fi
            echo "credential not present yet (try $i), waiting 30s"
            sleep 30
          done
          if [ ! -f "$CRED" ]; then
            echo "Forcing a FairPlay license by installing a free app (QuickTime)"
            QID=$(mas search QuickTime | awk '{print $1; exit}')
            echo "installing QuickTime (id $QID)"
            mas install "$QID" || true
            sleep 30
          fi
          if [ ! -f "$CRED" ]; then
            echo "FAIL: credential.bin still missing after signin + app install" >&2
            ls -la "$HOME/Library/FairPlay" 2>/dev/null || true
            exit 1
          fi
          ls -la "$CRED"

      - name: Package credential
        run: |
          set -e
          CRED="$HOME/Library/FairPlay/credential.bin"
          mkdir -p out
          cp "$CRED" out/credential.bin
          chmod 600 out/credential.bin
          xxd -p "$CRED" | tr -d '\n' > out/credential.hex
          echo "size: $(wc -c < out/credential.bin) bytes"

      - name: Optional IPA decrypt
        if: inputs.ipa_url != ''
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -e
          python3 -m pip install -q --user gdown
          python3 -m gdown "$IPA_URL" -O app.ipa --fuzzy || curl -fL "$IPA_URL" -o app.ipa
          ls -la app.ipa
          mkdir -p appx && (cd appx && unzip -q ../app.ipa)
          SINF=$(find appx -path "*/SC_Info/*.sinf" | head -1)
          SUPF=$(find appx -path "*/SC_Info/*.supf" | head -1)
          echo "sinf=$SINF"
          echo "supf=$SUPF"
          git clone -q https://github.com/EthanArbuckle/fairplay-decrypt fpd \
            || git clone -q https://github.com/David-0-U/fairplay-decrypt fpd
          python3 fpd/fairplay_decrypt.py --sinf "$SINF" --supf "$SUPF" --key out/credential.bin --ipa app.ipa -o decrypted || {
            echo "--- fairplay_decrypt usage ---"; python3 fpd/fairplay_decrypt.py --help || true; exit 1; }
          OUT=$(find decrypted -name "*.ipa" | head -1)
          if [ -z "$OUT" ]; then echo "no output ipa found" >&2; find decrypted -type f | head -30; exit 1; fi
          cp "$OUT" out/app-decrypted.ipa
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fp-output
          path: out/
          retention-days: 1
