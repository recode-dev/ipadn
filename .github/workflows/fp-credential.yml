name: fp-credential
on:
  workflow_dispatch:
    inputs:
      apple_email:
        description: "Apple ID email (leave 'none' for recon-only run)"
        required: true
        default: "none"
        type: string
      app_password:
        description: "App-specific password (Settings > Passwords & Security > App-Specific Passwords). Create a NEW one after use & delete the run."
        required: true
        default: "none"
        type: string
      otp_code:
        description: "Optional 6-digit 2FA code if the app-specific password alone is rejected"
        required: false
        default: ""
        type: string
      ipa_url:
        description: "Optional: public link to an encrypted IPA (Drive file link OK) to decrypt in the same run"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  credential:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Diagnose App Store + Apple network + region
        run: |
          set +e
          mkdir -p /tmp/fpshots
          snap() { screencapture -x "/tmp/fpshots/$1.png" 2>/dev/null || true; }
          echo "===== 1. Apple endpoint reachability ====="
          curl -sS -m 15 -o /dev/null -w "apps.apple.com -> %{http_code} (%{time_total}s)\n" https://apps.apple.com 2>&1 || echo "apps.apple.com UNREACHABLE"
          curl -sS -m 15 -o /dev/null -w "itunes lookup -> %{http_code}\n" "https://itunes.apple.com/lookup?id=409183697" 2>&1 || echo "itunes UNREACHABLE"
          curl -sS -m 15 -o /dev/null -w "amp-api -> %{http_code}\n" "https://amp-api.apps.apple.com/v1/apps?limit=1" 2>&1 || echo "amp-api UNREACHABLE"
          echo "===== 2. mas present? account state? ====="
          if ! command -v mas >/dev/null 2>&1; then brew install --quiet mas 2>&1 | tail -2 || true; fi
          mas --version 2>&1 || true
          echo "--- mas search QuickTime (tests Apple search API) ---"
          mas search QuickTime 2>&1 | head -4 || echo "mas search FAILED"
          echo "--- mas account (is runner pre-signed-in?) ---"
          mas account 2>&1 | head -8 || echo "mas account FAILED (not signed in)"
          echo "===== 3. current region/storefront defaults ====="
          defaults read com.apple.AppStore 2>&1 | head -25 || echo "(no com.apple.AppStore defaults)"
          defaults read -g AppleLocale 2>&1 | head -2 || true
          defaults read -g AppleCountry 2>&1 | head -2 || true
          defaults read -g AppleStoreFront 2>&1 | head -2 || true
          echo "===== 4. apply region fix + restart store daemons ====="
          defaults write com.apple.AppStore AppleStoreFront -string "US" 2>/dev/null || true
          defaults write -g AppleLocale -string "en_US" 2>/dev/null || true
          defaults write -g AppleCountry -string "US" 2>/dev/null || true
          for d in storeaccountd storedaemon storeagentd; do sudo -n killall $d 2>/dev/null; killall $d 2>/dev/null; done
          sleep 10
          echo "===== 5. reopen App Store, wait 60s, capture ====="
          osascript -e 'tell application "App Store" to quit' 2>/dev/null || true
          sleep 3
          open -a "App Store" || true
          sleep 30
          snap 50_launched
          for i in 1 2 3 4 5 6; do
            osascript -e 'tell application "System Events" to tell process "App Store"
              try
                click button "Retry" of window 1
              end try' 2>/dev/null || true
            sleep 10
            snap "51_retry_$i"
          done
          snap 52_final
          echo "===== 5b. Menu bar structure (Store menu) ====="
          osascript -e '
          set out to ""
          tell application "System Events"
            tell process "App Store"
              repeat with mbi in menu bar items of menu bar 1
                set nm to (name of mbi) as string
                set out to out & "MENU: " & nm & linefeed
                try
                  repeat with mi in menu items of menu 1 of mbi
                    set out to out & "  ITEM: " & ((name of mi) as string) & linefeed
                  end repeat
                end try
              end repeat
            end tell
          end tell
          return out' > /tmp/fpshots/menu_dump.txt 2>&1 || true
          cat /tmp/fpshots/menu_dump.txt | head -40
          echo "===== 6. AX dump ====="
          osascript -e '
          set out to ""
          tell application "System Events"
            tell process "App Store"
              repeat with w in windows
                set out to out & "WINDOW: " & (name of w) & linefeed
                try
                  repeat with el in (entire contents of w)
                    try
                      set out to out & (class of el as string) & " | name=" & (name of el as string) & " | desc=" & (description of el as string) & linefeed
                    end try
                  end repeat
                end try
              end repeat
            end tell
          end tell
          return out' > /tmp/fpshots/axdump.txt 2>&1 || true
          echo "axdump lines: $(wc -l < /tmp/fpshots/axdump.txt)"
          echo "DIAGNOSTIC DONE"

      - name: Upload recon (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fp-recon
          path: /tmp/fpshots/
          retention-days: 1

      - name: Sign in via App Store Store-menu
        if: inputs.apple_email != 'none'
        env:
          EMAIL: ${{ inputs.apple_email }}
          PW: ${{ inputs.app_password }}
          OTP: ${{ inputs.otp_code }}
        run: |
          set -e
          snap() { screencapture -x "/tmp/fpshots/$1.png" 2>/dev/null || true; }
          osascript -e 'tell application "App Store" to activate' || true
          sleep 3
          # Open the Store menu and click "Sign In..." (name may vary slightly)
          osascript <<'APPLESCRIPT' || true
          tell application "System Events"
            tell process "App Store"
              set frontmost to true
              delay 1
              tell menu bar 1
                tell menu bar item "Store"
                  click
                  delay 1
                  set itemNames to name of menu items of menu 1
                  log "Store menu items: " & (itemNames as string)
                end tell
              end tell
              repeat with cand in {"Sign In...", "Sign In", "Log In..."}
                try
                  click menu item cand of menu 1 of menu bar item "Store" of menu bar 1
                  log "clicked " & cand
                  exit repeat
                end try
              end repeat
            end tell
          end tell
          APPLESCRIPT
          sleep 6
          snap 60_after_signin_click
          # Fill the sign-in dialog (sheet on window 1): email, then password
          osascript <<APPLESCRIPT || true
          tell application "System Events"
            tell process "App Store"
              set frontmost to true
              delay 1
              tell window 1
                try
                  tell sheet 1
                    set fields to text fields
                    log "sheet has " & (count of fields) & " text fields"
                    click field 1
                    delay 1
                    keystroke "$EMAIL"
                    delay 1
                    click field 2
                    delay 1
                    keystroke "$PW"
                    delay 1
                    try
                      click button "Continue"
                      log "clicked Continue"
                    on error
                      key code 36 -- Return
                    end try
                  end tell
                on error e1
                  log "no sheet: " & e1
                end try
              end tell
            end tell
          end tell
          APPLESCRIPT
          sleep 12
          snap 61_after_password
          if [ -n "$OTP" ]; then
            osascript <<APPLESCRIPT || true
            tell application "System Events"
              tell process "App Store"
                set frontmost to true
                delay 1
                try
                  tell window 1
                    tell sheet 1
                      try
                        click field 1
                        delay 1
                        keystroke "$OTP"
                        delay 1
                        key code 36
                      on error
                        keystroke "$OTP"
                        delay 1
                        key code 36
                      end try
                    end tell
                  end tell
                end try
              end tell
            end tell
            APPLESCRIPT
            sleep 12
            snap 62_after_otp
          fi
          echo "menu-driven sign-in sequence finished"

      - name: Ensure FairPlay credential exists
        if: inputs.apple_email != 'none'
        run: |
          set -e
          CRED="$HOME/Library/FairPlay/credential.bin"
          for i in 1 2 3 4 5 6 7 8; do
            if [ -f "$CRED" ]; then break; fi
            echo "credential not present yet (try $i), waiting 30s"
            sleep 30
          done
          if [ ! -f "$CRED" ]; then
            echo "Trying to force a FairPlay license via a free app (QuickTime)"
            if ! command -v mas >/dev/null 2>&1; then brew install --quiet mas || true; fi
            sudo -n true 2>/dev/null || true
            QID=$(mas search QuickTime 2>/dev/null | awk '{print $1; exit}')
            echo "QuickTime id: $QID"
            [ -n "$QID" ] && mas get "$QID" || true
            sleep 30
          fi
          if [ ! -f "$CRED" ]; then
            echo "FAIL: credential.bin still missing" >&2
            ls -la "$HOME/Library/FairPlay" 2>/dev/null || echo "no FairPlay dir"
            exit 1
          fi
          ls -la "$CRED"

      - name: Package credential
        if: inputs.apple_email != 'none'
        run: |
          set -e
          CRED="$HOME/Library/FairPlay/credential.bin"
          mkdir -p out
          cp "$CRED" out/credential.bin
          chmod 600 out/credential.bin
          xxd -p "$CRED" | tr -d '\n' > out/credential.hex
          echo "size: $(wc -c < out/credential.bin) bytes"

      - name: Optional IPA decrypt
        if: inputs.ipa_url != '' && inputs.apple_email != 'none'
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -e
          python3 -m pip install -q --user gdown
          python3 -m gdown "$IPA_URL" -O app.ipa --fuzzy || curl -fL "$IPA_URL" -o app.ipa
          ls -la app.ipa
          mkdir -p appx && (cd appx && unzip -q ../app.ipa)
          SINF=$(find appx -path "*/SC_Info/*.sinf" | head -1)
          SUPF=$(find appx -path "*/SC_Info/*.supf" | head -1)
          echo "sinf=$SINF"
          echo "supf=$SUPF"
          git clone -q https://github.com/EthanArbuckle/fairplay-decrypt fpd \
            || git clone -q https://github.com/David-0-U/fairplay-decrypt fpd
          python3 fpd/fairplay_decrypt.py --sinf "$SINF" --supf "$SUPF" --key out/credential.bin --ipa app.ipa -o decrypted || {
            echo "--- fairplay_decrypt usage ---"; python3 fpd/fairplay_decrypt.py --help || true; exit 1; }
          OUT=$(find decrypted -name "*.ipa" | head -1)
          if [ -z "$OUT" ]; then echo "no output ipa found" >&2; find decrypted -type f | head -30; exit 1; fi
          cp "$OUT" out/app-decrypted.ipa
          ls -la out/

      - name: Upload artifacts
        if: inputs.apple_email != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: fp-output
          path: out/
          retention-days: 1
