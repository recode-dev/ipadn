name: fp-credential
on:
  workflow_dispatch:
    inputs:
      apple_email:
        description: "Apple ID email (leave 'none' for recon-only run)"
        required: true
        default: "none"
        type: string
      app_password:
        description: "App-specific password (Settings > Passwords & Security > App-Specific Passwords). Create a NEW one after use & delete the run."
        required: true
        default: "none"
        type: string
      otp_code:
        description: "Optional 6-digit 2FA code if the app-specific password alone is rejected"
        required: false
        default: ""
        type: string
      ipa_url:
        description: "Optional: public link to an encrypted IPA (Drive file link OK) to decrypt in the same run"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  credential:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Open App Store & dump UI structure (recon)
        run: |
          set -e
          mkdir -p /tmp/fpshots
          snap() { screencapture -x "/tmp/fpshots/$1.png" 2>/dev/null || true; }
          open -a "App Store" || true
          sleep 15
          snap 01_launched
          osascript -e 'tell application "App Store" to activate' || true
          sleep 5
          snap 02_active
          osascript -e '
          set out to ""
          tell application "System Events"
            tell process "App Store"
              repeat with w in windows
                set out to out & "WINDOW: " & (name of w) & linefeed
                try
                  repeat with el in (entire contents of w)
                    try
                      set out to out & (class of el as string) & " | name=" & (name of el as string) & " | desc=" & (description of el as string) & linefeed
                    end try
                  end repeat
                end try
              end repeat
            end tell
          end tell
          return out' > /tmp/fpshots/axdump.txt 2>&1 || true
          head -c 200000 /tmp/fpshots/axdump.txt > /tmp/fpshots/axdump-head.txt
          echo "axdump lines: $(wc -l < /tmp/fpshots/axdump.txt)"
          if [ "$EMAIL_IN" = "none" ]; then
            echo "Recon-only run: dumping UI and stopping."
          fi
        env:
          EMAIL_IN: ${{ inputs.apple_email }}

      - name: Upload recon (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fp-recon
          path: /tmp/fpshots/
          retention-days: 1

      - name: Sign in via App Store GUI
        if: inputs.apple_email != 'none'
        env:
          EMAIL: ${{ inputs.apple_email }}
          PW: ${{ inputs.app_password }}
          OTP: ${{ inputs.otp_code }}
        run: |
          set -e
          snap() { screencapture -x "/tmp/fpshots/$1.png" 2>/dev/null || true; }
          # v1: generic sign-in sheet handling; refined after recon dump
          osascript <<'APPLESCRIPT' || true
          tell application "App Store" to activate
          delay 2
          tell application "System Events"
            tell process "App Store"
              set frontmost to true
              delay 1
              try
                click button "Sign In" of window 1
                log "clicked Sign In button"
              on error e1
                try
                  click menu bar item 1 of menu bar 1
                  delay 1
                  click menu item "Sign In" of menu 1 of menu bar item 1 of menu bar 1
                  log "clicked Sign In menu item"
                on error e2
                  log "no sign-in entry point: " & e1 & " / " & e2
                end try
              end try
            end tell
          end tell
          APPLESCRIPT
          sleep 6
          snap 10_sheet_open
          osascript <<APPLESCRIPT || true
          tell application "System Events"
            tell process "App Store"
              set frontmost to true
              delay 1
              try
                tell window 1
                  try
                    click text field 1 of sheet 1
                    delay 1
                    keystroke "$EMAIL"
                    delay 1
                    key code 48 -- Tab
                    delay 1
                    keystroke "$PW"
                    delay 1
                    key code 36 -- Return
                  on error e1
                    log "sheet fields: $e1"
                  end try
                end try
              end try
            end tell
          end tell
          APPLESCRIPT
          sleep 10
          snap 11_after_creds
          if [ -n "$OTP" ]; then
            osascript <<APPLESCRIPT || true
            tell application "System Events"
              tell process "App Store"
                set frontmost to true
                delay 1
                try
                  tell window 1
                    try
                      click text field 1 of sheet 1
                      delay 1
                      keystroke "$OTP"
                      delay 1
                      key code 36
                    end try
                  end try
                end try
              end tell
            end tell
            APPLESCRIPT
            sleep 10
            snap 12_after_otp
          fi
          echo "GUI sign-in sequence finished (verify credential step next)"

      - name: Ensure FairPlay credential exists
        if: inputs.apple_email != 'none'
        run: |
          set -e
          CRED="$HOME/Library/FairPlay/credential.bin"
          for i in 1 2 3 4 5 6 7 8; do
            if [ -f "$CRED" ]; then break; fi
            echo "credential not present yet (try $i), waiting 30s"
            sleep 30
          done
          if [ ! -f "$CRED" ]; then
            echo "Trying to force a FairPlay license via a free app (QuickTime)"
            if ! command -v mas >/dev/null 2>&1; then brew install --quiet mas || true; fi
            sudo -n true 2>/dev/null || true
            QID=$(mas search QuickTime 2>/dev/null | awk '{print $1; exit}')
            echo "QuickTime id: $QID"
            [ -n "$QID" ] && mas get "$QID" || true
            sleep 30
          fi
          if [ ! -f "$CRED" ]; then
            echo "FAIL: credential.bin still missing" >&2
            ls -la "$HOME/Library/FairPlay" 2>/dev/null || echo "no FairPlay dir"
            exit 1
          fi
          ls -la "$CRED"

      - name: Package credential
        if: inputs.apple_email != 'none'
        run: |
          set -e
          CRED="$HOME/Library/FairPlay/credential.bin"
          mkdir -p out
          cp "$CRED" out/credential.bin
          chmod 600 out/credential.bin
          xxd -p "$CRED" | tr -d '\n' > out/credential.hex
          echo "size: $(wc -c < out/credential.bin) bytes"

      - name: Optional IPA decrypt
        if: inputs.ipa_url != '' && inputs.apple_email != 'none'
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          set -e
          python3 -m pip install -q --user gdown
          python3 -m gdown "$IPA_URL" -O app.ipa --fuzzy || curl -fL "$IPA_URL" -o app.ipa
          ls -la app.ipa
          mkdir -p appx && (cd appx && unzip -q ../app.ipa)
          SINF=$(find appx -path "*/SC_Info/*.sinf" | head -1)
          SUPF=$(find appx -path "*/SC_Info/*.supf" | head -1)
          echo "sinf=$SINF"
          echo "supf=$SUPF"
          git clone -q https://github.com/EthanArbuckle/fairplay-decrypt fpd \
            || git clone -q https://github.com/David-0-U/fairplay-decrypt fpd
          python3 fpd/fairplay_decrypt.py --sinf "$SINF" --supf "$SUPF" --key out/credential.bin --ipa app.ipa -o decrypted || {
            echo "--- fairplay_decrypt usage ---"; python3 fpd/fairplay_decrypt.py --help || true; exit 1; }
          OUT=$(find decrypted -name "*.ipa" | head -1)
          if [ -z "$OUT" ]; then echo "no output ipa found" >&2; find decrypted -type f | head -30; exit 1; fi
          cp "$OUT" out/app-decrypted.ipa
          ls -la out/

      - name: Upload artifacts
        if: inputs.apple_email != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: fp-output
          path: out/
          retention-days: 1
